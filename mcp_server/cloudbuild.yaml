steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - mcp_server/Dockerfile
      - -t
      - "${_IMAGE}"
      - .
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

images:
  - "${_IMAGE}"

options:
  substitutionOption: MUST_MATCH
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
